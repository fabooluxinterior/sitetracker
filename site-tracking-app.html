<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f97316"><title>SiteTrack v2</title><style>:root{--orange:#f97316;--dark:#c2410c;--ink:#1f303b;--muted:#6d7b84;--line:#e3e9ed;--soft:#fff7ed;--good:#147a55;--bad:#b42318;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:760px;min-height:100vh;margin:auto;background:white;box-shadow:0 0 30px #17232b12}.header{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:4}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;color:var(--dark);font-size:23px;letter-spacing:-.5px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.2px}.gpspill{font-size:11px;font-weight:850;color:var(--dark);background:var(--soft);border-radius:99px;padding:8px 11px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gpsdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--orange);margin-right:5px}.gpsdot.ok{background:#21a366}.nav{display:flex;gap:7px;margin-top:13px}.nav button{padding:8px 12px;border-radius:9px;background:#fff0e1;color:var(--dark);font-size:12px;font-weight:900}.nav button.active{background:var(--orange);color:#fff}.nav .exit{margin-left:auto;background:#fff0f0;color:var(--bad)}main{padding:25px 22px 45px}.eyebrow{text-transform:uppercase;letter-spacing:1.2px;color:var(--dark);font-size:10px;font-weight:950}.title{font-size:29px;line-height:1.12;margin:7px 0 9px;letter-spacing:-.5px}.subtitle{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 21px}.card{border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0;background:#fff}.soft{background:var(--soft);border-color:#fed7aa}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field select,.field textarea{display:block;width:100%;border:1px solid #ccd8de;border-radius:10px;padding:12px 13px;outline:none;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f9731620}.actions{display:flex;gap:10px;margin-top:16px}.btn{width:100%;min-height:46px;border-radius:10px;padding:12px 14px;font-weight:950}.primary{background:var(--orange);color:#fff}.secondary{background:#fff0e1;color:var(--dark)}.outline{background:#fff;border:1px solid #ffc48d;color:var(--dark)}.ghost{background:transparent;color:var(--dark);text-align:left;padding-left:0}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{border-radius:10px;padding:12px 13px;font-size:13px;line-height:1.45;margin:12px 0}.notice.bad{background:#fff0f0;color:var(--bad)}.notice.good{background:#e9f8f0;color:var(--good)}.notice.info{background:#eef7ff;color:#245b81}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metricbox{border:1px solid #fed7aa;background:#fffaf5;border-radius:13px;padding:17px;text-align:center}.metricbox span{display:block;color:var(--muted);font-size:11px;font-weight:800}.metricbox strong{display:block;color:var(--dark);font-size:29px;margin-top:4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.siteitem{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.siteitem:first-child{border-top:0}.siteitem strong{display:block;font-size:15px}.siteitem small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.45}.status{display:inline-block;border-radius:99px;padding:5px 8px;background:#e9f8f0;color:var(--good);font-size:10px;font-weight:950;white-space:nowrap}.camera{background:#101820;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}.camera video,.camera img{width:100%;height:100%;object-fit:cover;display:block}.camera p{color:#fff;text-align:center;font-size:13px;padding:25px;line-height:1.45}.camera-actions{display:flex;gap:8px;margin-top:9px}.camera-actions button{flex:1}.timebar{font-size:12px;color:var(--muted);padding:10px 12px;background:#f6f8f9;border-radius:9px;margin:10px 0}.timebar strong{color:var(--ink)}.tabs{display:flex;gap:7px;margin:10px 0 14px}.tabs button{padding:9px 13px;border-radius:9px;background:#eef1f2;color:var(--muted);font-size:12px;font-weight:900}.tabs button.active{background:var(--orange);color:#fff}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.table{border-collapse:collapse;width:100%;min-width:1180px;font-size:11px}.table th{background:var(--soft);color:var(--dark);padding:11px;text-align:left;white-space:nowrap}.table td{padding:10px;border-top:1px solid var(--line);vertical-align:top;line-height:1.4}.table a{color:var(--dark);font-weight:800}.empty{text-align:center;color:var(--muted);padding:20px;font-size:13px}.hidden{display:none!important}@media(max-width:520px){main{padding:21px 15px 35px}.header{padding:15px}.title{font-size:26px}.row{grid-template-columns:1fr}.metrics{gap:8px}.metricbox{padding:13px}.metricbox strong{font-size:25px}}
</style></head><body><div class="shell"><header class="header"><div class="top"><div class="brand">SiteTrack<small>Coordinator site sessions</small></div><div id="gpspill" class="gpspill"><i class="gpsdot"></i>GPS not checked</div></div><div id="nav" class="nav hidden"></div></header><main id="app"></main></div><script>(()=>{const API='https://script.google.com/macros/s/AKfycbwlSWEv7viovJNHd6xYs6On6IksAfJr5GK0xuQDS8EHXatQpgyNlOJWe7FWB_H6HBJ_kQ/exec';const S={token:sessionStorage.getItem('st2_token')||'',user:JSON.parse(sessionStorage.getItem('st2_user')||'null'),page:'home',site:null,workingDay:1,days:[],selfie:null,logoutSelfie:null,stream:null,gps:null,serverNow:new Date(),timezone:'Asia/Kolkata',adminTab:'visits'};const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=x=>x?new Date(x).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—';const key=(n,l)=>`${String(n).trim()}|${String(l).trim()}`;async function post(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,...data})});const d=await r.json();if(!d.ok)throw Error(d.error||'Request failed');return d}async function get(action,data={}){const q=new URLSearchParams({action,token:S.token,...data});const r=await fetch(API+'?'+q);const d=await r.json();if(!d.ok)throw Error(d.error||'Request failed');return d}function msg(text,type='bad'){return `<div class="notice ${type}">${esc(text)}</div>`}function setAuth(d){S.token=d.token;S.user=d.user;S.serverNow=d.serverNow?new Date(d.serverNow):new Date();S.timezone=d.timezone||'Asia/Kolkata';sessionStorage.setItem('st2_token',S.token);sessionStorage.setItem('st2_user',JSON.stringify(S.user))}function render(){updateGps();if(!S.user){$('nav').classList.add('hidden');return login()}nav();if(S.page==='home')home();else if(S.page==='login-details')loginDetails();else if(S.page==='login-confirm')loginConfirm();else if(S.page==='logout-select')logoutSelect();else if(S.page==='logout-details')logoutDetails();else if(S.page==='admin')admin()}function nav(){const active=p=>S.page===p?'active':'';$('nav').classList.remove('hidden');$('nav').innerHTML=`<button id="navhome" class="${active('home')}">Home</button>${S.user.role==='admin'?`<button id="navadmin" class="${active('admin')}">Admin</button>`:''}<button id="navexit" class="exit">Sign out</button>`;$('navhome').onclick=()=>{S.page='home';render()};$('navexit').onclick=()=>{sessionStorage.clear();S.token='';S.user=null;S.page='home';render()};if($('navadmin'))$('navadmin').onclick=()=>{S.page='admin';render()}}function updateGps(){if(!$('gpspill'))return;$('gpspill').innerHTML=S.gps?`<i class="gpsdot ok"></i>${esc(S.gps.label)}`:'<i class="gpsdot"></i>GPS not checked'}function login(){$('app').innerHTML=`<div style="max-width:440px;margin:38px auto"><div class="eyebrow">Secure access</div><h1 class="title">Welcome to SiteTrack</h1><p class="subtitle">Sign in to record site attendance with verified selfie and location.</p><div class="card"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="coordinator@company.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div><button id="signin" class="btn primary">Sign in</button><div id="loginmsg"></div></div><small style="color:var(--muted)">Access is managed from the Google Sheet Users tab.</small></div>`;$('signin').onclick=async()=>{try{const d=await post('login',{email:$('email').value,password:$('password').value});setAuth(d);S.page='home';render()}catch(x){$('loginmsg').innerHTML=msg(x.message)}}}async function locate(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error('This browser does not support location access.'));navigator.geolocation.getCurrentPosition(async p=>{S.gps={latitude:p.coords.latitude,longitude:p.coords.longitude,label:`GPS ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`};try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${S.gps.latitude}&longitude=${S.gps.longitude}&localityLanguage=en`);const d=await r.json();S.gps.label=[d.locality||d.city||d.localityInfo?.administrative?.[2]?.name,d.principalSubdivision].filter(Boolean).join(', ')||S.gps.label}catch(e){}updateGps();resolve(S.gps)},()=>reject(Error('Location access is required. Please allow GPS access.')),{enableHighAccuracy:true,timeout:12000,maximumAge:0})})}async function openCamera(kind){try{await locate();S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.srcObject=S.stream;$('camera').replaceChildren(v);$('capture').disabled=false;$('cameraMsg').textContent=kind==='login'?'Camera ready. Capture the login selfie.':'Camera ready. Capture the logout selfie.'}catch(x){$('cameraMsg').textContent=x.message}}function capture(kind){const v=$('camera').querySelector('video');if(!v)return;const c=document.createElement('canvas');c.width=v.videoWidth||720;c.height=v.videoHeight||540;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.82);if(kind==='login')S.selfie=data;else S.logoutSelfie=data;if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}$('camera').innerHTML=`<img src="${data}" alt="Captured selfie">`;$('capture').disabled=true;$('captureMsg').textContent='Selfie captured successfully.'}function timeBar(){return `<div class="timebar">Recorded time: <strong id="clock">${fmt(S.serverNow)}</strong> <span>(${esc(S.timezone)})</span></div>`}function cameraBlock(kind){return `<div class="camera" id="camera"><p id="cameraMsg">Camera permission and a selfie are required.</p></div><div class="camera-actions"><button id="openCamera" class="btn secondary">Allow camera + location</button><button id="capture" class="btn primary" disabled>Capture selfie</button></div><div id="captureMsg" class="notice info">No selfie captured yet.</div>`}function loginDetails(){$('app').innerHTML=`<div class="eyebrow">Step 1 of 2 · Site details</div><h1 class="title">Start a site login</h1><p class="subtitle">Enter the site information, then allow camera and location access. Both are mandatory.</p><div class="card"><div class="field"><label>Site name</label><input id="siteName" placeholder="Project or site name"></div><div class="field"><label>Site location</label><input id="siteLocation" placeholder="Ernakulam, Edappally"></div><div class="field"><label>Number of workers</label><input id="workers" type="number" min="0" step="1" placeholder="0"></div>${timeBar()}<h3 style="margin:18px 0 7px;font-size:15px">Required verification</h3>${cameraBlock('login')}<div id="detailMsg"></div><button id="continueLogin" class="btn primary">Continue to working-day summary</button></div><button id="backHome" class="btn ghost">← Back home</button>`;$('openCamera').onclick=()=>openCamera('login');$('capture').onclick=()=>capture('login');$('backHome').onclick=()=>{S.page='home';render()};$('continueLogin').onclick=async()=>{const n=$('siteName').value.trim(),l=$('siteLocation').value.trim(),w=$('workers').value;if(!n||!l||w==='')return $('detailMsg').innerHTML=msg('Site name, location, and worker count are required.');try{if(!S.gps)await locate();if(!S.selfie)throw Error('Capture the required selfie before continuing.');const d=await get('days_used',{siteKey:key(n,l)});S.site={name:n,location:l,workers:Number(w)};S.days=d.days||[];const today=new Intl.DateTimeFormat('en-CA',{timeZone:S.timezone}).format(new Date());S.workingDay=S.days.includes(today)?S.days.length:Math.min(S.days.length+1,15);S.page='login-confirm';render()}catch(x){$('detailMsg').innerHTML=msg(x.message)}}}function loginConfirm(){$('app').innerHTML=`<div class="eyebrow">Step 2 of 2 · Confirm site login</div><h1 class="title">Working-day summary</h1><p class="subtitle">Review the day number before creating the active site session.</p><div class="card"><div class="metricbox" style="margin-bottom:12px"><span>${esc(S.site.name)} · ${esc(S.site.location)}</span><strong>${esc(S.site.workers)} workers</strong></div><div class="metrics"><div class="metricbox"><span>Working day</span><strong>${S.workingDay}</strong></div><div class="metricbox"><span>Total days</span><strong>15</strong></div></div>${timeBar()}<div class="notice info">The server records the official login time. Multiple logins on the same calendar day remain working day ${S.workingDay}; the next calendar day becomes the next number.</div><div id="confirmMsg"></div><button id="confirmLogin" class="btn primary">Confirm site login</button></div><button id="backDetails" class="btn ghost">← Back to site details</button>`;$('backDetails').onclick=()=>{S.page='login-details';render()};$('confirmLogin').onclick=async()=>{try{const d=await post('site_login',{token:S.token,siteName:S.site.name,siteLocation:S.site.location,workers:S.site.workers,loginSelfieDataUrl:S.selfie,locationName:S.gps.label,latitude:S.gps.latitude,longitude:S.gps.longitude});S.serverNow=new Date(d.serverNow||Date.now());S.selfie=null;S.page='home';render()}catch(x){$('confirmMsg').innerHTML=msg(x.message)}}}async function home(){const d=await get('active').catch(()=>({active:[]}));S.active=d.active||[];$('app').innerHTML=`<div class="eyebrow">${S.user.role==='admin'?'Administrator':'Coordinator'} home</div><h1 class="title">Active sites</h1><p class="subtitle">Signed in as <strong>${esc(S.user.name)}</strong>. Sites remain active until a verified logout is completed.</p><div class="card soft"><div class="row"><div><span style="display:block;color:var(--muted);font-size:11px;font-weight:800">Active now</span><strong style="font-size:23px;color:var(--dark)">${S.active.length}</strong></div><div style="text-align:right"><span style="display:block;color:var(--muted);font-size:11px;font-weight:800">Current location</span><strong style="font-size:13px">${esc(S.gps?.label||'Not checked')}</strong></div></div></div><div class="actions"><button id="loginSite" class="btn primary">＋ Login site</button><button id="logoutSite" class="btn secondary">Logout site</button></div><div class="card"><h2 style="font-size:18px;margin:0 0 5px">Currently active</h2>${S.active.length?S.active.map(v=>`<div class="siteitem"><div><strong>${esc(v.siteName)}</strong><small>${esc(v.siteLocation)}<br>${esc(v.coordinatorName)} · Login ${fmt(v.loginAt)} · Working day ${v.workingDay}/15</small></div><span class="status">ACTIVE</span></div>`).join(''):'<div class="empty">No active sites right now.</div>'}</div>`;$('loginSite').onclick=()=>{S.page='login-details';S.selfie=null;render()};$('logoutSite').onclick=()=>{S.page='logout-select';render()}}function logoutSelect(){$('app').innerHTML=`<div class="eyebrow">Site logout · Step 1</div><h1 class="title">Select an active site</h1><p class="subtitle">Choose the site you want to close. A verified selfie, fresh location, and server time are required on the next step.</p><div class="card"><div class="field"><label>Active site</label><select id="logoutSelect"><option value="">Select an active site</option>${S.active.map(v=>`<option value="${esc(v.sessionId)}">${esc(v.siteName)} · ${esc(v.siteLocation)}</option>`).join('')}</select></div><div id="selectMsg"></div><button id="continueLogout" class="btn primary">Continue to logout verification</button></div><button id="backHome" class="btn ghost">← Back home</button>`;$('backHome').onclick=()=>{S.page='home';render()};$('continueLogout').onclick=()=>{const v=S.active.find(x=>x.sessionId===$('logoutSelect').value);if(!v)return $('selectMsg').innerHTML=msg('Select an active site first.');S.logoutSite=v;S.logoutSelfie=null;S.page='logout-details';render()}}function logoutDetails(){$('app').innerHTML=`<div class="eyebrow">Site logout · Step 2</div><h1 class="title">Close ${esc(S.logoutSite.siteName)}</h1><p class="subtitle">${esc(S.logoutSite.siteLocation)} · Logged in ${fmt(S.logoutSite.loginAt)}</p><div class="card"><h3 style="margin:0 0 8px;font-size:15px">Required verification</h3>${cameraBlock('logout')}${timeBar()}<div class="field"><label>Comment <span style="color:var(--muted);font-weight:600">(optional)</span></label><textarea id="comment" placeholder="Add a note about this site session, if needed"></textarea></div><div id="logoutMsg"></div><button id="confirmLogout" class="btn primary">Confirm site logout</button></div><button id="backSelect" class="btn ghost">← Back to site selection</button>`;$('openCamera').onclick=()=>openCamera('logout');$('capture').onclick=()=>capture('logout');$('backSelect').onclick=()=>{S.page='logout-select';render()};$('confirmLogout').onclick=async()=>{try{if(!S.gps)await locate();if(!S.logoutSelfie)throw Error('Capture the required logout selfie before continuing.');const d=await post('site_logout',{token:S.token,sessionId:S.logoutSite.sessionId,logoutSelfieDataUrl:S.logoutSelfie,locationName:S.gps.label,latitude:S.gps.latitude,longitude:S.gps.longitude,logoutComment:$('comment').value});S.serverNow=new Date(d.serverNow||Date.now());S.logoutSelfie=null;S.logoutSite=null;S.page='home';render()}catch(x){$('logoutMsg').innerHTML=msg(x.message)}}}function admin(){if(S.user.role!=='admin'){S.page='home';return render()}$('app').innerHTML=`<div class="eyebrow">Administrator</div><h1 class="title">Activity and users</h1><p class="subtitle">Every site session is stored in the new Google Sheet database with coordinator, time, location, worker count, selfies, and comments.</p><div class="tabs"><button id="visitTab" class="${S.adminTab==='visits'?'active':''}">Visits</button><button id="userTab" class="${S.adminTab==='users'?'active':''}">Users</button></div><div id="adminBody"></div>`;$('visitTab').onclick=()=>{S.adminTab='visits';admin()};$('userTab').onclick=()=>{S.adminTab='users';admin()};if(S.adminTab==='users')users();else visits()}async function visits(){$('adminBody').innerHTML=`<div class="card"><div class="field"><label>Search site name or location</label><input id="aq"></div><div class="field"><label>Search coordinator</label><input id="ac"></div><div class="row"><div class="field"><label>From date</label><input id="af" type="date"></div><div class="field"><label>To date</label><input id="at" type="date"></div></div><div class="field"><label>Sort records</label><select id="as"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="site">Site name</option><option value="coordinator">Coordinator</option></select></div><button id="apply" class="btn primary">Apply filters</button></div><div id="adminResult">Loading records…</div>`;$('apply').onclick=loadAdmin;loadAdmin()}async function loadAdmin(){try{const d=await get('admin_data',{q:$('aq').value,coordinator:$('ac').value,from:$('af').value,to:$('at').value,sort:$('as').value}),v=d.data.visits;$('adminResult').innerHTML=`<div class="card soft"><div class="row"><div>Total records<br><strong>${d.data.total}</strong></div><div style="text-align:right">Active now<br><strong>${d.data.active.length}</strong></div></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Status</th><th>Site</th><th>Coordinator</th><th>Workers / Day</th><th>Login time</th><th>Login location</th><th>Login selfie</th><th>Logout time</th><th>Logout location</th><th>Logout selfie</th><th>Comment</th></tr></thead><tbody>${v.length?v.map(x=>`<tr><td>${esc(x.status)}</td><td><b>${esc(x.siteName)}</b><br>${esc(x.siteLocation)}</td><td>${esc(x.coordinatorName)}<br>${esc(x.coordinatorEmail)}</td><td>${x.workers}<br>${x.workingDay}/${x.totalDays}</td><td>${fmt(x.loginAt)}</td><td>${esc(x.loginLocation)}<br><small>${x.loginLatitude}, ${x.loginLongitude}</small></td><td>${x.loginSelfieUrl?`<a href="${esc(x.loginSelfieUrl)}" target="_blank">Open</a>`:'—'}</td><td>${fmt(x.logoutAt)}</td><td>${x.logoutLocation?`${esc(x.logoutLocation)}<br><small>${x.logoutLatitude}, ${x.logoutLongitude}</small>`:'—'}</td><td>${x.logoutSelfieUrl?`<a href="${esc(x.logoutSelfieUrl)}" target="_blank">Open</a>`:'—'}</td><td>${esc(x.logoutComment||'—')}</td></tr>`).join(''):'<tr><td colspan="11" class="empty">No matching records.</td></tr>'}</tbody></table></div>`}catch(x){$('adminResult').innerHTML=msg(x.message)}}async function users(){$('adminBody').innerHTML=`<div class="card"><h2 style="font-size:18px;margin:0 0 4px">Add or edit user</h2><p class="subtitle" style="margin-bottom:12px">Create coordinators or additional administrators.</p><div class="field"><label>Email</label><input id="ue" type="email"></div><div class="field"><label>Password</label><input id="up" type="password" placeholder="Required for new users"></div><div class="field"><label>Display name</label><input id="un"></div><div class="row"><div class="field"><label>Role</label><select id="ur"><option value="coordinator">Coordinator</option><option value="admin">Admin</option></select></div><div class="field"><label>Status</label><select id="ua"><option value="true">Active</option><option value="false">Disabled</option></select></div></div><button id="saveUser" class="btn primary">Save user</button><div id="userMsg"></div></div><div class="card" id="userList">Loading users…</div>`;$('saveUser').onclick=async()=>{try{await post('admin_save_user',{token:S.token,email:$('ue').value,password:$('up').value,name:$('un').value,role:$('ur').value,active:$('ua').value});$('userMsg').innerHTML=msg('User saved.','good');users()}catch(x){$('userMsg').innerHTML=msg(x.message)}};try{const d=await get('admin_users');$('userList').innerHTML='<h2 style="font-size:18px;margin:0 0 5px">Current users</h2>'+(d.users.length?d.users.map(u=>`<div class="siteitem"><div><strong>${esc(u.name)}</strong><small>${esc(u.email)} · ${esc(u.role)} · ${u.active?'Active':'Disabled'}</small></div><button data-email="${esc(u.email)}" class="btn secondary" style="width:auto;min-height:36px;padding:8px 11px">Edit</button></div>`).join(''):'<div class="empty">No users.</div>');$('userList').querySelectorAll('button').forEach(b=>b.onclick=()=>{const u=d.users.find(x=>x.email===b.dataset.email);$('ue').value=u.email;$('un').value=u.name;$('ur').value=u.role;$('ua').value=String(u.active)})}catch(x){$('userList').innerHTML=msg(x.message)}}S.page=S.user?'home':'login';render()})();</script></body></html>

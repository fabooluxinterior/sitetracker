<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><title>SiteTrack</title>
<style>
:root{--orange:#f97316;--orange2:#ea580c;--ink:#24313b;--muted:#71808a;--line:#e7edf0;--soft:#fff7ed;--green:#16845b;--red:#c83f3f;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f7f8f9;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:680px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 34px #1c2b3814}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 20px;position:sticky;top:0;z-index:5}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:23px;color:var(--orange2)}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.2px}.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--orange2);padding:7px 10px;border-radius:99px;font-size:11px;font-weight:800}.dot{width:7px;height:7px;background:var(--orange);border-radius:50%}.dot.ok{background:#2cad78}.nav{display:flex;gap:8px;margin-top:14px}.nav button{background:#fff5eb;color:#9a4c17;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800}.nav button.active{background:var(--orange);color:#fff}.nav button.logout{margin-left:auto;background:#fef2f2;color:var(--red)}main{padding:22px 20px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:900;color:var(--orange2)}h1{font-size:28px;line-height:1.12;margin:7px 0 8px;color:var(--ink)}h2{font-size:20px;margin:0 0 12px}.sub{color:var(--muted);line-height:1.5;font-size:14px;margin:0 0 20px}.card{border:1px solid var(--line);border-radius:16px;padding:17px;background:#fff;margin:13px 0;box-shadow:0 8px 22px #26323b0b}.soft{background:var(--soft);border-color:#fed7aa;box-shadow:none}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #d5dfe4;border-radius:10px;outline:none;background:#fff;color:var(--ink)}.field input:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f9731620}.btn{width:100%;padding:13px 15px;border-radius:10px;font-weight:900;min-height:46px}.primary{background:var(--orange);color:#fff}.primary:hover{background:var(--orange2)}.secondary{background:#fff3e6;color:var(--orange2)}.ghost{background:transparent;color:var(--orange2);padding:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:16px}.actions .btn{flex:1}.notice{padding:12px;border-radius:10px;font-size:13px;line-height:1.45;margin:12px 0}.notice.info{background:#eff8ff;color:#275b79}.notice.good{background:#e9f8f0;color:#16704c}.notice.bad{background:#fff0f0;color:#a23d3d}.notice.warn{background:#fff4df;color:#82500d}.metric{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.metric:last-child{border:0}.metric strong{text-align:right}.status{font-size:11px;font-weight:900;border-radius:99px;padding:5px 8px}.status.active{background:#e9f8f0;color:var(--green)}.status.completed{background:#eef1f3;color:#5d6b73}.site-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.site-item:last-child{border:0}.site-item strong{display:block;font-size:14px}.site-item small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.site-item button{background:#fff3e6;color:var(--orange2);padding:8px 10px;border-radius:8px;font-size:11px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:18px 5px;font-size:13px}.camera{background:#111;border-radius:14px;overflow:hidden;aspect-ratio:4/3}.camera video,.camera img{width:100%;height:100%;display:block;object-fit:cover}.camera-placeholder{height:100%;display:grid;place-items:center;color:#fff;padding:25px;text-align:center}.camera-row{display:flex;gap:8px;margin-top:10px}.camera-row .btn{flex:1}.searchbar{display:flex;gap:8px}.searchbar input{flex:1}.searchbar button{width:auto;padding:10px 14px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{border-collapse:collapse;width:100%;min-width:760px;font-size:11px}.table th{background:var(--soft);color:#9a4c17;text-align:left;padding:10px;white-space:nowrap}.table td{padding:10px;border-top:1px solid var(--line);vertical-align:top}.admin-tabs{display:flex;gap:6px;margin:12px 0}.admin-tabs button{padding:9px 11px;border-radius:8px;background:#f3f4f5;color:#66757d;font-size:12px;font-weight:800}.admin-tabs button.active{background:var(--orange);color:#fff}.modal{position:fixed;inset:0;background:#17212b99;z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-width:680px;border-radius:20px 20px 0 0;padding:23px 20px 28px}.modal-box h2{color:var(--orange2)}.modal-box p{color:var(--muted);font-size:14px;line-height:1.5}.tiny{font-size:11px;color:var(--muted)}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:681px){body{padding:20px 0}.app{border-radius:18px;overflow:hidden}.modal{align-items:center}.modal-box{border-radius:18px;max-width:480px}}
</style>
</head>
<body><div class="app"><header><div class="top"><div class="brand">SiteTrack<small>Coordinator site sessions</small></div><span id="gpsPill" class="pill"><i class="dot"></i>GPS checking</span></div><div id="nav" class="nav hidden"></div></header><main id="screen"></main></div>
<div id="gpsModal" class="modal"><div class="modal-box"><h2>Turn on location</h2><p>SiteTrack needs GPS to verify site sessions and logout selfies. Location must be enabled before a logout selfie can be accepted.</p><div id="gpsMessage"></div><button id="gpsButton" class="btn primary">Enable GPS</button></div></div>
<script>
(()=>{
const API='https://script.google.com/macros/s/AKfycbwlSWEv7viovJNHd6xYs6On6IksAfJr5GK0xuQDS8EHXatQpgyNlOJWe7FWB_H6HBJ_kQ/exec';
const state={token:localStorage.getItem('st_token')||'',user:JSON.parse(localStorage.getItem('st_user')||'null'),gps:null,stream:null,selfie:null,active:[],customer:null,days:0,screen:'home',adminView:'visits',adminData:null};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});const d=await r.json();if(!d.ok)throw new Error(d.error||'Request failed');return d}
async function get(action,params={}){const q=new URLSearchParams({action,token:state.token,...params});const r=await fetch(API+'?'+q.toString());const d=await r.json();if(!d.ok)throw new Error(d.error||'Request failed');return d}
function saveAuth(d){state.token=d.token;state.user=d.user;localStorage.setItem('st_token',d.token);localStorage.setItem('st_user',JSON.stringify(d.user))}
function clearAuth(){localStorage.removeItem('st_token');localStorage.removeItem('st_user');state.token='';state.user=null;state.active=[];state.screen='login';render()}
function gpsLabel(){return state.gps?state.gps.label:''}
async function locate(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('This browser does not support GPS.'));navigator.geolocation.getCurrentPosition(async p=>{state.gps={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:Math.round(p.coords.accuracy),label:`GPS ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`};updateGps();resolve(state.gps);try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&localityLanguage=en`,{signal:AbortSignal.timeout(2200)});const d=await r.json();const place=[d.locality||d.city,d.principalSubdivision].filter(Boolean).join(', ');if(place){state.gps.label=place;updateGps()}}catch(e){}},e=>reject(new Error('Location is disabled or unavailable.')), {enableHighAccuracy:true,timeout:10000,maximumAge:30000})})}
function updateGps(){const pill=$('gpsPill');if(!pill)return; pill.innerHTML=state.gps?`<i class="dot ok"></i>${esc(state.gps.label)}`:'<i class="dot"></i>GPS unavailable'}
async function requireGps(){if(state.gps)return state.gps;try{return await locate()}catch(e){showGpsModal(e.message);throw e}}
function showGpsModal(message){$('gpsMessage').innerHTML=message?`<div class="notice bad">${esc(message)}</div>`:'';$('gpsModal').classList.add('show')}
$('gpsButton').onclick=async()=>{try{await locate();$('gpsModal').classList.remove('show');render()}catch(e){showGpsModal(e.message)}};
function render(){updateGps();if(!state.user){$('nav').classList.add('hidden');loginScreen();return}buildNav();if(state.screen==='home')homeScreen();if(state.screen==='site')siteScreen();if(state.screen==='logout')logoutScreen();if(state.screen==='admin')adminScreen()}
function buildNav(){$('nav').classList.remove('hidden');$('nav').innerHTML=`<button class="${state.screen==='home'?'active':''}" id="homeNav">Home</button>${state.user.role==='admin'?`<button class="${state.screen==='admin'?'active':''}" id="adminNav">Admin</button>`:''}<button class="logout" id="logoutNav">Log out</button>`;$('homeNav').onclick=()=>{state.screen='home';render()};$('logoutNav').onclick=clearAuth;if($('adminNav'))$('adminNav').onclick=()=>{state.screen='admin';render()}}
function loginScreen(){$('screen').innerHTML=`<div style="max-width:430px;margin:38px auto"><div class="kicker">Secure access</div><h1>Welcome to SiteTrack</h1><p class="sub">Sign in to manage your site sessions.</p><div class="card"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="coordinator@company.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password"></div><button id="loginBtn" class="btn primary">Sign in</button><div id="loginMsg"></div></div><p class="tiny">Credentials are managed in the Google Sheet by an administrator.</p></div>`;$('loginBtn').onclick=async()=>{const b=$('loginBtn');b.disabled=true;b.innerHTML='<span class="spinner"></span> Signing in';try{const d=await api('login',{email:$('email').value,password:$('password').value});saveAuth(d);state.screen='home';state.active=d.active||[];try{await refreshActive()}catch(e){}render()}catch(e){$('loginMsg').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`;b.disabled=false;b.textContent='Sign in'}}}
async function refreshActive(){const d=await get('active');state.active=d.active||[]}
function homeScreen(){$('screen').innerHTML=`<div class="kicker">${state.user.role==='admin'?'Administrator':'Coordinator'} home</div><h1>Currently at your sites</h1><p class="sub">Signed in as <strong>${esc(state.user.name)}</strong>. Start or finish multiple site sessions on the same day.</p><div class="card soft"><div class="metric"><span>GPS</span><strong>${esc(gpsLabel()||'Not checked')}</strong></div><div class="metric"><span>Active now</span><strong>${state.active.length}</strong></div></div><div class="card"><h2>Active sites now</h2><div id="activeList">Loading…</div></div><button id="newSite" class="btn primary">＋ Site login</button>`;$('newSite').onclick=()=>{state.screen='site';render()};loadActiveList()}
async function loadActiveList(){try{await refreshActive();const el=$('activeList');if(!el)return;el.innerHTML=state.active.length?state.active.map(s=>`<div class="site-item"><div><strong>${esc(s.clientName)}</strong><small>${esc(s.siteLocation)} · logged in ${new Date(s.loginAt).toLocaleString()} · day ${s.workingDay}/15</small></div><div><span class="status active">ACTIVE</span><button data-id="${esc(s.sessionId)}">Logout</button></div></div>`).join(''):'<div class="empty">No active sites. Start a site login to begin.</div>';el.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.selected=state.active.find(x=>x.sessionId===b.dataset.id);state.screen='logout';render()})}catch(e){$('activeList').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
async function siteScreen(){state.customer=null;$('screen').innerHTML=`<div class="kicker">Site login</div><h1>Start a site session</h1><p class="sub">Select a recent customer or search the complete project history.</p><div class="card"><div class="field"><label>Recent customers — last 30 days</label><select id="recent"><option>Loading customers…</option></select></div><div class="field"><label>Search all projects</label><div class="searchbar"><input id="search" placeholder="Project name or location"><button id="searchBtn" class="secondary">Search</button></div></div><div id="results"></div><div class="field"><label>Number of workers</label><input id="workers" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 12"></div><label class="field"><span style="display:block;font-weight:800;font-size:13px;margin-bottom:7px">Login selfie</span><div id="loginCamera" class="camera"><div class="camera-placeholder">Take a selfie after GPS is enabled.</div></div><div class="camera-row"><button id="openLoginCamera" type="button" class="btn secondary">Open camera</button><button id="captureLogin" type="button" class="btn primary" disabled>Capture</button></div></label><button id="loginSiteBtn" class="btn primary">Login to selected site</button><div id="siteMsg"></div></div><button id="backHome" class="btn ghost">← Back home</button>`;$('backHome').onclick=()=>{state.screen='home';render()};$('searchBtn').onclick=()=>searchProjects($('search').value.trim());$('recent').onchange=()=>{const c=state.recent?.find(x=>x.customerId===$('recent').value);if(c)state.customer=c};$('openLoginCamera').onclick=openLoginCamera;$('captureLogin').onclick=captureLoginSelfie;$('loginSiteBtn').onclick=loginSite;try{const d=await get('customers');state.recent=d.customers||[];const s=$('recent');s.innerHTML='<option value="">Select a recent customer</option>'+state.recent.map(c=>`<option value="${esc(c.customerId)}">${esc(c.name)} — ${esc(c.location)}</option>`).join('')}catch(e){$('siteMsg').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
async function searchProjects(q){if(!q)return;$('results').innerHTML='<div class="tiny">Searching…</div>';try{const d=await get('search',{q});state.results=d.customers||[];$('results').innerHTML=state.results.length?state.results.map(c=>`<div class="site-item"><div><strong>${esc(c.name)}</strong><small>${esc(c.location)} · ${new Date(c.lastVisit).toLocaleDateString()}</small></div><button data-id="${esc(c.customerId)}">Select</button></div>`).join(''):'<div class="empty">No matching project.</div>';$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.customer=state.results.find(x=>x.customerId===b.dataset.id);$('search').value=state.customer.name})}catch(e){$('results').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
async function openLoginCamera(){try{await requireGps();state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=true;v.srcObject=state.stream;$('loginCamera').replaceChildren(v);$('captureLogin').disabled=false}catch(e){$('siteMsg').innerHTML=`<div class="notice bad">${esc(e.message||'Camera access is required.')}</div>`}}
function captureLoginSelfie(){const v=$('loginCamera').querySelector('video');if(!v)return;const c=document.createElement('canvas');c.width=v.videoWidth||720;c.height=v.videoHeight||540;c.getContext('2d').drawImage(v,0,0,c.width,c.height);state.loginSelfie=c.toDataURL('image/jpeg',.78);if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}$('loginCamera').innerHTML=`<img src="${state.loginSelfie}" alt="Login selfie">`;$('captureLogin').disabled=true;$('openLoginCamera').textContent='Retake selfie';$('openLoginCamera').onclick=()=>{state.loginSelfie=null;openLoginCamera()}}
async function loginSite(){if(!state.customer){$('siteMsg').innerHTML='<div class="notice warn">Select a customer first.</div>';return}if(!state.loginSelfie){$('siteMsg').innerHTML='<div class="notice warn">Capture the login selfie first.</div>';return}try{const gps=await requireGps();const b=$('loginSiteBtn');b.disabled=true;b.innerHTML='<span class="spinner"></span> Starting';const d=await get('days_used',{customerId:state.customer.customerId});const workers=$('workers').value.replace(/[^0-9]/g,'');const r=await api('site_login',{token:state.token,customerId:state.customer.customerId,clientName:state.customer.name,siteLocation:state.customer.location,workers,loginSelfieDataUrl:state.loginSelfie,locationName:gps.label,latitude:gps.latitude,longitude:gps.longitude});state.active=r.active||[];state.screen='home';render()}catch(e){$('siteMsg').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
function logoutScreen(){const s=state.selected;$('screen').innerHTML=`<div class="kicker">Site logout</div><h1>${esc(s?.clientName||'Active site')}</h1><p class="sub">${esc(s?.siteLocation||'')}<br>Take a fresh selfie now. Time and GPS are captured at logout.</p><div class="card"><div id="camera" class="camera"><div class="camera-placeholder">Open the camera to take the logout selfie.</div></div><div class="camera-row"><button id="openCamera" class="btn secondary">Open camera</button><button id="capture" class="btn primary" disabled>Capture selfie</button></div><div id="logoutMeta"></div></div><div class="actions"><button id="cancelLogout" class="btn ghost">Cancel</button><button id="finishLogout" class="btn primary" disabled>Logout site</button></div>`;$('openCamera').onclick=openCamera;$('capture').onclick=captureSelfie;$('finishLogout').onclick=finishLogout;$('cancelLogout').onclick=()=>{state.screen='home';render()}}
async function openCamera(){try{state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=true;v.srcObject=state.stream;$('camera').replaceChildren(v);$('capture').disabled=false}catch(e){$('logoutMeta').innerHTML='<div class="notice bad">Camera access is required for logout.</div>'}}
function captureSelfie(){const v=$('camera').querySelector('video');if(!v)return;const c=document.createElement('canvas');c.width=v.videoWidth||720;c.height=v.videoHeight||540;c.getContext('2d').drawImage(v,0,0,c.width,c.height);state.selfie={dataUrl:c.toDataURL('image/jpeg',.78),capturedAt:new Date().toISOString()};if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null}$('camera').innerHTML=`<img src="${state.selfie.dataUrl}" alt="Logout selfie">`;$('capture').disabled=true;$('openCamera').textContent='Retake selfie';$('openCamera').onclick=()=>{state.selfie=null;openCamera()};$('logoutMeta').innerHTML='<div class="notice good">Selfie captured. Checking GPS…</div>';$('finishLogout').disabled=false}
async function finishLogout(){try{if(!state.selfie)throw new Error('Capture a selfie first.');const gps=await requireGps();const b=$('finishLogout');b.disabled=true;b.innerHTML='<span class="spinner"></span> Saving';const r=await api('site_logout',{token:state.token,sessionId:state.selected.sessionId,logoutSelfieDataUrl:state.selfie.dataUrl,locationName:gps.label,latitude:gps.latitude,longitude:gps.longitude});state.active=r.active||[];state.selfie=null;state.screen='home';render()}catch(e){$('logoutMeta').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`;$('finishLogout').disabled=false;$('finishLogout').textContent='Logout site'}}
async function adminScreen(){if(state.user.role!=='admin'){state.screen='home';render();return}$('screen').innerHTML=`<div class="kicker">Admin panel</div><h1>Site activity</h1><p class="sub">Filter by project, coordinator, or date. Credentials are managed from the Users tab.</p><div class="admin-tabs"><button class="${state.adminView==='visits'?'active':''}" id="visitsTab">Visits</button><button class="${state.adminView==='users'?'active':''}" id="usersTab">Users</button></div><div id="adminBody"><div class="tiny">Loading…</div></div>`;$('visitsTab').onclick=()=>{state.adminView='visits';adminScreen()};$('usersTab').onclick=()=>{state.adminView='users';adminScreen()};if(state.adminView==='visits')adminVisits();else adminUsers()}
async function adminVisits(){const b=$('adminBody');b.innerHTML=`<div class="card"><div class="field"><label>Project name or site</label><input id="aq" placeholder="Search project"></div><div class="field"><label>Coordinator</label><input id="ac" placeholder="Email or name"></div><div class="row"><div class="field"><label>From</label><input id="af" type="date"></div><div class="field"><label>To</label><input id="at" type="date"></div></div><button id="applyFilters" class="btn primary">Apply filters</button></div><div id="adminResults"></div>`;$('applyFilters').onclick=loadAdminData;loadAdminData()}
async function loadAdminData(){const el=$('adminResults');el.innerHTML='<div class="tiny">Loading activity…</div>';try{const d=await get('admin_data',{q:$('aq')?.value||'',coordinator:$('ac')?.value||'',from:$('af')?.value||'',to:$('at')?.value||''});state.adminData=d.data;el.innerHTML=`<div class="card soft"><div class="metric"><span>Total records</span><strong>${d.data.total}</strong></div><div class="metric"><span>Active now</span><strong>${d.data.active.length}</strong></div><div class="metric"><span>Coordinators</span><strong>${d.data.coordinators.length}</strong></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Status</th><th>Project</th><th>Coordinator</th><th>Login</th><th>Logout</th><th>Day</th><th>Workers</th><th>Locations</th></tr></thead><tbody>${d.data.visits.map(v=>`<tr><td><span class="status ${v.status.toLowerCase()}">${esc(v.status)}</span></td><td><strong>${esc(v.clientName)}</strong><br>${esc(v.siteLocation)}</td><td>${esc(v.coordinatorName)}<br>${esc(v.coordinatorEmail)}</td><td>${v.loginAt?new Date(v.loginAt).toLocaleString():'—'}<br>${esc(v.loginLocation)}</td><td>${v.logoutAt?new Date(v.logoutAt).toLocaleString():'—'}<br>${esc(v.logoutLocation||'—')}</td><td>${v.workingDay}/${v.totalDays}</td><td>${v.workers}</td><td>${v.loginLatitude?`${v.loginLatitude.toFixed(5)}, ${v.loginLongitude.toFixed(5)}`:'—'}</td></tr>`).join('')}</tbody></table></div>`}catch(e){el.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
async function adminUsers(){const b=$('adminBody');b.innerHTML=`<div class="card"><h2>Add or edit user</h2><div class="field"><label>Email</label><input id="ue" type="email" placeholder="person@company.com"></div><div class="field"><label>Password</label><input id="up" type="password" placeholder="Required for a new user; leave blank to keep existing"></div><div class="field"><label>Display name</label><input id="un" placeholder="Coordinator name"></div><div class="row"><div class="field"><label>Role</label><select id="ur"><option value="coordinator">Coordinator</option><option value="admin">Admin</option></select></div><div class="field"><label>Access</label><select id="ua"><option value="true">Active</option><option value="false">Disabled</option></select></div></div><button id="saveUser" class="btn primary">Save user</button><div id="userMsg"></div></div><div id="userTable" class="card"><div class="tiny">Loading users…</div></div>`;$('saveUser').onclick=saveUser;try{const d=await get('admin_users');$('userTable').innerHTML=`<h2>Users</h2><div class="table-wrap"><table class="table"><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Access</th><th>Updated</th><th>Edit</th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${u.active?'Active':'Disabled'}</td><td>${u.updatedAt?new Date(u.updatedAt).toLocaleString():'—'}</td><td><button class="secondary" data-email="${esc(u.email)}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;$('userTable').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const u=d.users.find(x=>x.email===btn.dataset.email);$('ue').value=u.email;$('un').value=u.name;$('ur').value=u.role;$('ua').value=String(u.active)})}catch(e){$('userTable').innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
async function saveUser(){const msg=$('userMsg');try{await api('admin_save_user',{token:state.token,email:$('ue').value,password:$('up').value,name:$('un').value,role:$('ur').value,active:$('ua').value});msg.innerHTML='<div class="notice good">User saved in Google Sheets.</div>';adminUsers()}catch(e){msg.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}
render();
setTimeout(()=>{if(state.user){refreshActive().then(render).catch(()=>{});if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(p=>{if(p.state==='granted')locate();else showGpsModal()}).catch(()=>showGpsModal())}else if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(p=>{if(p.state==='granted')locate();else showGpsModal()}).catch(()=>showGpsModal())},250);
})();
</script></body></html>
